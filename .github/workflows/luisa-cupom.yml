name: Pipeline Cupom - Luisa

on:
  push:
    branches:
      - "feature/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py build

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout github
        uses: actions/checkout@v4

      - name: Gerar imagem docker
        run: docker build -t minimercado:1.0 .

      - name: Verificar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercado:1.0
          severity: "HIGH,CRITICAL"
          exit-code: '0'

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: luisacarvalho06
          password: ${{ secrets.DOCKERHUB_TOKEN_LUISACARVALH006 }}

      - name: Rotular Imagem
        run: docker tag minimercado:1.0 luisacarvalho06/minimercado:1.0

      - name: Push to Docker Hub
        run: docker push luisacarvalho06/minimercado:1.0
