name: Pipeline Cupom - Luisa

on:
  push:
    branches:
      - "ref/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tasks.py build

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout github
        uses: actions/checkout@v4
        
      - name: Gerar imagem docker 
        run: docker build -t minimercado:1.0 .
        
      - name: Verificar Vulnerabiliades 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercado:1.0
          severity: "HIGH,CRITICAL"
          exit-code: '1'
  
