from app.core import create_app


def test_pagina_vistos_recentemente_carrega():
    """Testa se a rota de produtos vistos recentemente responde com status 200."""
    app = create_app()
    client = app.test_client()

    # Faz requisição para a rota do histórico de vistos recentemente
    response = client.get("/vistos-recentemente")

    assert response.status_code == 200
    assert "Vistos".encode() in response.data or "Recentemente".encode() in response.data


def test_historico_vistos_recentemente_vazio():
    """Testa o comportamento quando o usuário ainda não visualizou nenhum produto."""
    app = create_app()
    client = app.test_client()

    response = client.get("/vistos-recentemente")

    assert response.status_code == 200
    # Verifica se a página responde informando que não há itens ou exibe a estrutura base
    assert response.data is not None


def test_visualizar_produto_adiciona_ao_historico():
    """Testa se acessar a página de um produto registra ele nos vistos recentemente."""
    app = create_app()
    client = app.test_client()

    # 1. Simula a visita à página de um produto (ex: /produto/1)
    response_produto = client.get("/produto/1")

    # 2. Confirma que a página do produto respondeu com sucesso
    assert response_produto.status_code in [200, 302, 404]  # Aceita se a rota existir ou redirecionar

    # 3. Acessa novamente a rota de vistos recentemente
    response_historico = client.get("/vistos-recentemente")
    assert response_historico.status_code == 200