name: CI

on:
  push:
    
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tasks.py

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout github
        uses: actions/checkout@v6
        
      - name: Gerar imagem docker
        run: docker build -t minimercado:1.0 .

      - name: Verificar vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercado:1.0
          severity: "HIGH,CRITICAL"
          exit-code: '0'

      - name: Login no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME_JOAONICOLAU}}
          password: ${{secrets.DOCKERHUB_TOKEN_JOAONICOLAU}}

      - name: Rotular imagem
        run: docker tag minimercado:1.0 ${{secrets.DOCKERHUB_USERNAME_JOAONICOLAU}}/minimercado:1.0

      - name: Push to docker
        run: docker push ${{secrets.DOCKERHUB_USERNAME_JOAONICOLAU}}/minimercado:1.0
