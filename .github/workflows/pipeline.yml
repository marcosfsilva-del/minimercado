name: CI

on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py

  realese:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fazer checkout github
        uses: actions/checkout@v4

      - name: Gerar imagem docker
        run: docker build -t minimercado:1.0 .

      - name: Verificar Vulnerabilidade
        uses: aquasecurity/trivy-action@v0.36.0
        with:
           scan-type: image
           image-ref: minimercado:1.0
           severity: "HIGH,CRITICAL"
           ignore-unfixed: true
           exit-code: '1'

      - name: Login no dockerhub
        uses: docker/login-action@v3
        with:
          username: $((secrets, DOCKERHUB_USERNAME_YAGOLOPES01))
          password: $((secrets, DOCKERHUB_TOKEN_YAGOLOPES01))

      - name: Rotular imagem
        run: docker tag minimercado:1.0 $((secrets, DOCKERHUB_USERNAME_YAGOLOPES01))/minimercado:1.0

      - name: Push to Docker
        run: docker push $((secrets, DOCKERHUB_USERNAME_YAGOLOPES01))/minimercado:1.0
