name: CI

on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar imagem Docker
        run: docker build -t minimercado:1.0 .

      - name: Verificar Vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'minimercado:1.0'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_RADUZINHO0914 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_RADUZINHO0914 }}

      - name: Rotular imagem
        run: docker tag minimercado:1.0 ${{ secrets.DOCKERHUB_USERNAME_RADUZINHO0914 }}/devops-market:1.0

      - name: Publicar no Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME_RADUZINHO0914 }}/devops-market:1.0
