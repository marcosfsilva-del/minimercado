name: CI

 
on:
  push:
 
jobs:
 
  lint:
    name: Lint
    runs-on: ubuntu-latest
 
    steps:
      - name: Baixar c├│digo
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
 
      - name: Lint com Ruff
        run: python -m ruff check .
 
 
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
 
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
 
      - name: Testes com Pytest
        run: python -m pytest -v
 
 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
 
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt


  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
 
    steps:
      - name: Fazer checkout github
        uses: actions/checkout@v4
 
      - name: Gerar imagem docker
        run: docker build -t minimercado:1.0 .
 
      - name: Verificiar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.26.0
        with:
         scan-type: image
         image-ref: minimercado:1.0
         severity: "HIGH,CRITICAL"
         exit-code: "1"
